# Fork only: build the NUC image from nuc/v3.0.0-beta.4 and publish it to this
# fork's GHCR. amd64 only (the NUC). Upstream's workflows are untouched.
name: nuc-image

on:
  push:
    branches: ['nuc/v3.0.0-beta.4']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nuc-image
  cancel-in-progress: true

jobs:
  image:
    if: github.repository_owner == 'cookie-monster1649'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        run: |
          short=$(git rev-parse --short HEAD)
          echo "SHORT=$short" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=nuc-${{ env.SHORT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/cookie-monster1649/droppedneedle:nuc-v3.0.0-beta.4
            ghcr.io/cookie-monster1649/droppedneedle:nuc-${{ env.SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
